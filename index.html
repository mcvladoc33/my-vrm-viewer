<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VRM Viewer Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white; padding: 15px;
            border-radius: 8px; pointer-events: auto;
        }
        input { margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        <strong>VRM Viewer</strong><br>
        <small>Мишка: обертання, Колесо: зум</small><br><br>
        <label>Завантажити іншу модель:</label><br>
        <input type="file" id="fileInput" accept=".vrm">
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        let currentVrm = null;

        // --- Налаштування сцени ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.3, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Контролі (Мишка)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.2, 0); // Фокус на рівні грудей/обличчя
        controls.update();

        // Світло
        const light = new THREE.AmbientLight(0xffffff, 0.5); // Загальне світло
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(1, 2, 3);
        scene.add(dirLight);

        // Допоміжна сітка
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);

        // --- Завантажувач ---
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        function loadVRM(url) {
            // Видаляємо стару модель, якщо вона є
            if (currentVrm) {
                scene.remove(currentVrm.scene);
                currentVrm = null;
            }

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                currentVrm = vrm;
                scene.add(vrm.scene);
                vrm.scene.rotation.y = Math.PI; // Обличчям до нас
                console.log('Модель завантажена');
            });
        }

        // Завантаження дефолтної моделі
        loadVRM('/static/model.vrm');

        // --- Обробка локального файлу ---
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            loadVRM(url);
        });

        // --- Рендеринг ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const t = clock.elapsedTime;

            if (currentVrm) {
                // 1. Спочатку базове оновлення (важливо для VRM 0.0 перед зміною кісток)
                currentVrm.update(delta);

                // --- 2. АНІМАЦІЯ КІСТОК (Твоя робоча Idle-логіка) ---
                const breath = Math.sin(t * 1.5) * 0.02;
                const headSway = Math.sin(t * 0.7) * 0.05;

                const leftArm = currentVrm.humanoid.getRawBoneNode('leftUpperArm');
                const rightArm = currentVrm.humanoid.getRawBoneNode('rightUpperArm');
                if (leftArm && rightArm) {
                    leftArm.quaternion.setFromEuler(new THREE.Euler(0, 0, 1.3 + breath));
                    rightArm.quaternion.setFromEuler(new THREE.Euler(0, 0, -1.3 - breath));
                }

                const spine = currentVrm.humanoid.getRawBoneNode('spine');
                if (spine) {
                    spine.quaternion.setFromEuler(new THREE.Euler(breath, 0, 0));
                }

                const head = currentVrm.humanoid.getRawBoneNode('head');
                if (head) {
                    head.quaternion.setFromEuler(new THREE.Euler(0, headSway, 0));
                }

                // --- 3. ПРИРОДНЕ МОРГАННЯ (Твій оригінальний код) ---
                let blinkValue = 0;
                const blinkCycle = t % 4; // Цикл 4 секунди
                if (blinkCycle > 3.8) {   // Моргаємо лише в останні 0.2 сек циклу
                    blinkValue = Math.sin((blinkCycle - 3.8) * Math.PI * 5);
                }

                if (currentVrm.expressionManager) {
                    currentVrm.expressionManager.setValue('blink', blinkValue);
                } else if (currentVrm.blendShapeProxy) {
                    currentVrm.blendShapeProxy.setValue('blink', blinkValue);
                    // Додаємо цей рядок тільки якщо Blink все одно не оживе:
                    // currentVrm.blendShapeProxy.update(); 
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
